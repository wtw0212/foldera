name: Foldera
packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    exactVersion: 0.10.5
  # SSH/SFTP client. Pinned to 0.12.0: 0.12.1 swapped swift-nio-ssh for an unvetted third-party fork.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.0
configs:
  Debug: debug
  Release: release
  Testing: debug
options:
  bundleIdPrefix: com.wtw0212
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, zh-Hant]
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Silicon only.
    ARCHS: arm64
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Foldera:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      Testing: Config/Signing.xcconfig
    sources:
      - Foldera
      # 7-Zip's console program, run by Archives.swift; signed with the app.
      - path: ThirdParty/7-Zip/7zz
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: ThirdParty/7-Zip/7-Zip-License.txt
        buildPhase: resources
    dependencies:
      - package: Citadel
      - sdk: NetFS.framework
    settings:
      configs:
        # Tests have their own preferences domain and macOS permission identity.
        Testing:
          PRODUCT_BUNDLE_IDENTIFIER: com.wtw0212.foldera.test-host
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wtw0212.foldera
        PRODUCT_NAME: Foldera
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: Bonjour service types and Foldera's pasteboard type.
        INFOPLIST_FILE: Config/Foldera-Info.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Foldera looks for file servers and SFTP servers on your local network when you open Network.
        INFOPLIST_KEY_CFBundleDisplayName: Foldera
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        # A file manager needs unrestricted file system access, so the app is not sandboxed.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Foldera/Foldera.entitlements
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Foldera shows and manages the files in your Desktop folder.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Foldera shows and manages the files in your Documents folder.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Foldera shows and manages the files in your Downloads folder.
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: Foldera shows and manages files on removable drives.
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: Foldera shows and manages files on network drives.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Foldera asks Finder to show the Get Info window for items you select.
  FolderaTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      Testing: Config/Signing.xcconfig
    sources:
      - FolderaTests
      - path: scripts/installer-receipt.py
        buildPhase: resources
    dependencies:
      - target: Foldera
      - package: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wtw0212.foldera.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Foldera.app/Contents/MacOS/Foldera
        BUNDLE_LOADER: $(TEST_HOST)
  FolderaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - FolderaUITests
    dependencies:
      - target: Foldera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wtw0212.foldera.ui-tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Foldera
schemes:
  Foldera:
    build:
      targets:
        Foldera: all
        FolderaTests: [test]
    test:
      config: Testing
      gatherCoverageData: true
      coverageTargets: [Foldera]
      commandLineArguments:
        "-initialPath /tmp": true
        "-hasSeenWelcome YES": true
        "-fullDiskAccessBannerDismissed YES": true
      targets:
        - FolderaTests
  FolderaUI:
    build:
      targets:
        Foldera: all
        FolderaUITests: [test]
    test:
      config: Testing
      targets:
        - FolderaUITests
