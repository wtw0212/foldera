name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/make-dmg.sh
      - scripts/make-appcast.py
      - scripts/verify-update-signature.swift
      - scripts/optimize-release-helper.sh
      - project.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a tag such as v0.2.0" >&2
              exit 1
            fi
            printf 'VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check packaging inputs
        run: |
          bash -n scripts/make-dmg.sh
          if VERSION=invalid bash scripts/make-dmg.sh; then
            exit 1
          fi
          if VERSION=0.2.0 BUILD_NUMBER=invalid bash scripts/make-dmg.sh; then
            exit 1
          fi

      - name: Restore compiled packages
        # Swift packages (SwiftNIO, swift-crypto, Citadel) take most of a cold build. Their compiled output is
        # reused; the app's own sources are rebuilt because a fresh checkout makes them newer than the cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build.noindex/release
            !build.noindex/release/Logs
            !build.noindex/release/Index.noindex
          key: deriveddata-release-macos-26-xcode26.6-${{ hashFiles('project.yml') }}
          restore-keys: deriveddata-release-macos-26-xcode26.6-

      - name: Import the release signing certificate
        # Every release is signed with the same self-signed certificate, so macOS keeps Full Disk Access across
        # updates (its designated requirement names the certificate, not one build). Other builds are ad-hoc signed.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          P12: ${{ secrets.FOLDERA_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.FOLDERA_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" || -z "$P12_PASSWORD" ]]; then
            echo "The FOLDERA_SIGNING_P12 and FOLDERA_SIGNING_P12_PASSWORD secrets are required. See RELEASING.md." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security find-identity -p codesigning "$keychain" | grep -q '"foldera-release"'
          echo "SIGN_IDENTITY=foldera-release" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          SIGN_IDENTITY: ${{ env.SIGN_IDENTITY || '-' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/make-dmg.sh

      - name: Verify Apple Silicon app and DMG
        run: |
          app=build.noindex/release/Build/Products/Release/Foldera.app
          test "$(lipo -archs "$app/Contents/MacOS/Foldera")" = arm64
          test "$(lipo -archs "$app/Contents/MacOS/7zz")" = arm64
          codesign --verify --deep --strict "$app"
          if [[ "${SIGN_IDENTITY:-}" == "foldera-release" ]]; then
            # A different certificate would make every installed copy lose Full Disk Access.
            codesign -d -r- "$app" 2>&1 | grep -q 'certificate leaf = H"c6efa914a27106674473c4860c7992baaef77007"'
          fi
          if otool -l "$app/Contents/MacOS/Foldera" | grep -E 'segname __LLVM_COV|sectname __llvm_prf'; then
            echo "Release contains coverage instrumentation" >&2
            exit 1
          fi
          test "$(dwarfdump --uuid "$app/Contents/MacOS/Foldera" | awk '{print $2}')" = \
            "$(dwarfdump --uuid "$app.dSYM" | awk '{print $2}')"
          otool -l "$app.dSYM/Contents/Resources/DWARF/Foldera" | awk '
            $1 == "sectname" { debug = ($2 == "__debug_info") }
            debug && $1 == "size" && $2 !~ /^0x0*$/ { found = 1 }
            END { exit !found }
          '
          unzip -t dist/Foldera-*.dSYM.zip
          test -f "$app/Contents/Resources/7-Zip-License.txt"
          for language in en zh-Hant; do
            test -f "$app/Contents/Resources/$language.lproj/Localizable.strings"
          done
          hdiutil verify dist/Foldera-*.dmg
          # dyld stops the app at launch if the embedded Sparkle.framework fails library validation.
          "$app/Contents/MacOS/Foldera" -initialPath /tmp &
          pid=$!
          sleep 5
          kill "$pid"

      - name: Smoke-test Release archive helper
        run: |
          helper="$GITHUB_WORKSPACE/build.noindex/release/Build/Products/Release/Foldera.app/Contents/MacOS/7zz"
          archive_test=$(mktemp -d "$RUNNER_TEMP/foldera-archive.XXXXXX")
          trap 'rm -rf "$archive_test"' EXIT
          cd "$archive_test"
          printf 'Foldera Release archive round-trip.\n' > payload.txt
          "$helper" i > /dev/null
          for format in zip 7z; do
            "$helper" a "-t$format" "payload.$format" payload.txt -bso0 -bsp0
            "$helper" t "payload.$format" -bso0 -bsp0
            "$helper" x "payload.$format" "-oextracted-$format" -bso0 -bsp0
            cmp payload.txt "extracted-$format/payload.txt"
            echo "Verified Release helper $format round-trip"
          done

      - name: Sign the update and write the appcast
        # Installed copies download a release only through this signed feed, and install it only if the DMG's
        # signature matches the public key built into them. The private key is the SPARKLE_PRIVATE_KEY secret.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "The SPARKLE_PRIVATE_KEY repository secret is missing. See RELEASING.md." >&2
            exit 1
          fi
          sign_update=build.noindex/release/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
          app=build.noindex/release/Build/Products/Release/Foldera.app
          dmg="dist/Foldera-$VERSION.dmg"
          signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - -p "$dmg")
          xcrun swift scripts/verify-update-signature.swift "$app" "$dmg" "$signature"
          python3 scripts/make-appcast.py "$GITHUB_REPOSITORY" "$VERSION" "$BUILD_NUMBER" "$dmg" "$signature"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - dist/appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - --verify dist/appcast.xml

      - name: Create checksum
        working-directory: dist
        run: shasum -a 256 Foldera-*.dmg Foldera-*.dSYM.zip > SHA256SUMS.txt

      - name: Save release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foldera-release
          path: |
            dist/Foldera-*.dmg
            dist/SHA256SUMS.txt
            dist/Foldera-*.dSYM.zip
            dist/appcast.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The tagged commit has already been tested by CI (on main), so the release doesn't test it again: it
  # waits for that run while the DMG builds, and publishes only if it passed.
  ci:
    name: CI passed for this commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "CI hasn't run for $GITHUB_SHA. Tag a commit on main after its CI run has started." >&2
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null
          echo "CI run $run passed."

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foldera-release
          path: dist

      - name: Verify checksum and appcast
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS.txt
          test -s appcast.xml

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Foldera-*.dmg dist/SHA256SUMS.txt dist/Foldera-*.dSYM.zip dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Foldera $GITHUB_REF_NAME" \
            --notes "DMG for Apple Silicon Macs running macOS 26 or later. This build is ad-hoc signed and is not notarized by Apple."
