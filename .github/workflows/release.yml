name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/make-dmg.sh
      - scripts/test.sh
      - scripts/ci-report.py
      - scripts/tests/**
      - project.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a tag such as v0.2.0" >&2
              exit 1
            fi
            printf 'VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check packaging inputs
        run: |
          bash -n scripts/make-dmg.sh
          if VERSION=invalid bash scripts/make-dmg.sh; then
            exit 1
          fi
          if VERSION=0.2.0 BUILD_NUMBER=invalid bash scripts/make-dmg.sh; then
            exit 1
          fi

      - name: Generate project and run tests
        env:
          # CI gates coverage; a release only needs every test to pass.
          MINIMUM_APP_COVERAGE: "0"
        run: bash scripts/test.sh unit

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results
          path: build.noindex/test-results/unit
          retention-days: 7

      - name: Build universal DMG
        env:
          SIGN_IDENTITY: "-"
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/make-dmg.sh

      - name: Verify universal app and DMG
        run: |
          app=build.noindex/release/Build/Products/Release/Foldera.app
          for binary in Foldera 7zz; do
            architectures=$(lipo -archs "$app/Contents/MacOS/$binary")
            [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
          done
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/7-Zip-License.txt"
          for language in en zh-Hant; do
            test -f "$app/Contents/Resources/$language.lproj/Localizable.strings"
          done
          hdiutil verify dist/Foldera-*.dmg

      - name: Create checksum
        working-directory: dist
        run: shasum -a 256 Foldera-*.dmg > SHA256SUMS.txt

      - name: Save release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foldera-release
          path: |
            dist/Foldera-*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foldera-release
          path: dist

      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Foldera-*.dmg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Foldera $GITHUB_REF_NAME" \
            --notes "Universal DMG for Apple Silicon and Intel Macs running macOS 15 or later. This build is ad-hoc signed and is not notarized by Apple."
