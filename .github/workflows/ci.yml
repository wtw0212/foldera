name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz \
            --pattern actionlint_1.7.12_checksums.txt --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint workflows and shell scripts
        run: |
          actionlint
          shellcheck scripts/*.sh
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Test CI tooling and packaging input validation
        run: python3 -m unittest discover -s scripts/tests -v

  # The macOS jobs don't wait for validate: they take longest, and "CI passed" still requires all three.
  tests:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon, macOS 26
            runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make unchanged files look unchanged to the build system
        run: |
          python3 scripts/stable-mtimes.py
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          echo "RUNNER_IMAGE=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore compiled packages
        # Swift packages (SwiftNIO, swift-crypto, Citadel) take most of a cold build. Their compiled output is
        # reused, as long as the step before makes unchanged files look unchanged to the build system.
        # Cache entries are immutable: refresh for changed inputs, restoring the closest prior build first.
        # Each runner image stamps Xcode's files with new mtimes, which invalidates everything built on another image.
        id: compiled-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build.noindex/tests/DerivedData
            !build.noindex/tests/DerivedData/Logs
            !build.noindex/tests/DerivedData/Index.noindex
          key: deriveddata-unit-${{ matrix.runner }}-xcode${{ matrix.xcode }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('project.yml', 'Config/**', '**/Package.resolved', 'scripts/test.sh') }}-${{ hashFiles('Foldera/**', 'FolderaTests/**', 'ThirdParty/**') }}
          restore-keys: |
            deriveddata-unit-${{ matrix.runner }}-xcode${{ matrix.xcode }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('project.yml', 'Config/**', '**/Package.resolved', 'scripts/test.sh') }}-
            deriveddata-unit-${{ matrix.runner }}-xcode${{ matrix.xcode }}-${{ env.RUNNER_IMAGE }}-
            deriveddata-unit-${{ matrix.runner }}-xcode${{ matrix.xcode }}-

      # TEMPORARY: explains why tasks re-run on CI. Remove before merging.
      - name: Enable build debugging
        run: |
          defaults write com.apple.dt.XCBuild EnableBuildDebugging -bool YES
          defaults write com.apple.dt.SWBBuildService EnableBuildDebugging -bool YES
          (while sleep 2; do f=$(find build.noindex/test-results/unit -name test.log 2>/dev/null | head -1); if [ -n "$f" ]; then echo "$(date +%T) $(wc -l < "$f") $(tail -n 1 "$f" | cut -c1-70)"; fi; done) > "$RUNNER_TEMP/progress.log" 2>&1 &

      - name: Run unit and filesystem integration tests with coverage
        run: bash scripts/test.sh unit

      # TEMPORARY: explains why tasks re-run on CI. Remove before merging.
      - name: Report why tasks re-ran
        if: always()
        run: |
          grep -hE '^SwiftDriver ' build.noindex/test-results/unit/run.*/test.log | awk '{print $2}' | sort -u | tr '\n' ' ' || true
          awk '$2 != last { print; last = $2 }' "$RUNNER_TEMP/progress.log" | head -90 || true
          echo
          stat -f '%d %i %m %z %N' "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/clang/include/module.modulemap" || true
          python3 - <<'PY'
          import collections, glob, os, re
          traces = sorted(glob.glob("build.noindex/tests/DerivedData/**/build.trace", recursive=True), key=os.path.getmtime)
          print("traces:", traces[-3:])
          if traces:
              names, why = {}, {}
              for line in open(traces[-1], errors="replace"):
                  parts = re.findall(r'"((?:[^"\\]|\\.)*)"', line)
                  if len(parts) >= 3 and parts[0] == "new-rule":
                      names[parts[1]] = parts[2]
                  elif len(parts) >= 3 and parts[0] == "rule-needs-to-run":
                      why.setdefault(parts[1], parts[2:])
              print("reasons:", collections.Counter(w[0] for w in why.values()))
              roots = collections.Counter()
              for rule, reason in why.items():
                  seen = set()
                  while reason[0] == "input-rebuilt" and len(reason) > 1 and reason[1] in why and rule not in seen:
                      seen.add(rule)
                      rule = reason[1]
                      reason = why[rule]
                  roots[(reason[0], names.get(rule, rule)[:170])] += 1
              for (reason, name), count in roots.most_common(40):
                  print(count, reason, name)
          PY

      - name: Save compiled packages for test retries
        if: always() && !cancelled() && steps.compiled-cache.outcome == 'success' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.compiled-cache.outputs.cache-primary-key }}
          path: |
            build.noindex/tests/DerivedData
            !build.noindex/tests/DerivedData/Logs
            !build.noindex/tests/DerivedData/Index.noindex

      - name: Save results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.runner }}
          path: build.noindex/test-results/unit
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [navigation, tabs-search, options-rename, localization-network]
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      FOLDERA_UI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make unchanged files look unchanged to the build system
        run: |
          python3 scripts/stable-mtimes.py
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          echo "RUNNER_IMAGE=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore compiled packages
        # Swift packages (SwiftNIO, swift-crypto, Citadel) take most of a cold build. Their compiled output is
        # reused, as long as the step before makes unchanged files look unchanged to the build system.
        # Cache entries are immutable: refresh for changed inputs, restoring the closest prior build first.
        # Each runner image stamps Xcode's files with new mtimes, which invalidates everything built on another image.
        id: compiled-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build.noindex/tests/DerivedData
            !build.noindex/tests/DerivedData/Logs
            !build.noindex/tests/DerivedData/Index.noindex
          key: deriveddata-ui-macos-26-xcode26.6-${{ env.RUNNER_IMAGE }}-${{ hashFiles('project.yml', 'Config/**', '**/Package.resolved', 'scripts/test.sh') }}-${{ hashFiles('Foldera/**', 'FolderaUITests/**', 'ThirdParty/**') }}
          restore-keys: |
            deriveddata-ui-macos-26-xcode26.6-${{ env.RUNNER_IMAGE }}-${{ hashFiles('project.yml', 'Config/**', '**/Package.resolved', 'scripts/test.sh') }}-
            deriveddata-ui-macos-26-xcode26.6-${{ env.RUNNER_IMAGE }}-
            deriveddata-ui-macos-26-xcode26.6-

      - name: Run native UI tests
        # The navigation shard runs every test except the other shards' explicit subsets, so new tests
        # automatically remain covered. Each runner keeps UI execution serial on its own desktop.
        # Subsets are balanced by measured duration; move tests between them if one job grows much longer.
        run: |
          tabs_search="ExplorerUITests/testNewAndCloseTabKeyboardShortcuts ExplorerUITests/testRecursiveSearchAndEscapeRestoreTheListing"
          options_rename="ExplorerUITests/testSearchOptionsStayOpenAcrossFilterChanges ExplorerUITests/testClickingTheSelectedNameAgainRenamesIt ExplorerUITests/testWindowButtonsAreCenteredInTheTabStripAfterResize"
          localization_network="NetworkUITests ExplorerUITests/testTraditionalChineseStatusAndAddressNavigation ExplorerUITests/testServerFileCommandsAreLocalizedAndDisabledWithoutSessions"
          flag=-only-testing
          case "$FOLDERA_UI_SHARD" in
            tabs-search) tests=$tabs_search ;;
            options-rename) tests=$options_rename ;;
            localization-network) tests=$localization_network ;;
            *) flag=-skip-testing; tests="$tabs_search $options_rename $localization_network" ;;
          esac
          args=()
          for test in $tests; do args+=("$flag:FolderaUITests/$test"); done
          bash scripts/test.sh ui "${args[@]}"

      - name: Save compiled packages for test retries
        if: always() && !cancelled() && steps.compiled-cache.outcome == 'success' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.compiled-cache.outputs.cache-primary-key }}
          path: |
            build.noindex/tests/DerivedData
            !build.noindex/tests/DerivedData/Logs
            !build.noindex/tests/DerivedData/Index.noindex

      - name: Save UI results and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: build.noindex/test-results/ui
          if-no-files-found: warn
          retention-days: 14

  ui_gate:
    name: UI smoke tests
    if: always()
    needs: [ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every UI shard to succeed
        env:
          UI_RESULT: ${{ needs.ui.result }}
        run: test "$UI_RESULT" = success

  passed:
    name: CI passed
    if: always()
    needs: [validate, tests, ui_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          UI_RESULT: ${{ needs.ui_gate.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$UI_RESULT" = success
